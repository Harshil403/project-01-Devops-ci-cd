apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {}

    http {
      server {
        listen 80;
        server_name _;

        location / {
          proxy_pass http://todo-frontend:80;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /api/ {
          proxy_pass http://todo-backend:5000/api/;
        }

        location /todos {
          proxy_pass http://todo-backend:5000/todos;
        }

        location /metrics {
          proxy_pass http://todo-backend:5000/metrics;
        }
      }
    }
